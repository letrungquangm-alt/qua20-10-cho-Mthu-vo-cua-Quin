<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Brown & Champagne Rose Gradients -->
    <radialGradient id="roseBrown1" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#faedcd"/>
      <stop offset="40%" stop-color="#d4a373"/>
      <stop offset="80%" stop-color="#a06c4b"/>
      <stop offset="100%" stop-color="#6f4e37"/>
    </radialGradient>
    <radialGradient id="roseCream" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fefae0"/>
      <stop offset="85%" stop-color="#e9d8a6"/>
      <stop offset="100%" stop-color="#c59b6d"/>
    </radialGradient>
    <radialGradient id="roseCoffee" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e6ccb2"/>
      <stop offset="50%" stop-color="#b08968"/>
      <stop offset="90%" stop-color="#7f4f24"/>
      <stop offset="100%" stop-color="#4a2810"/>
    </radialGradient>
    <linearGradient id="kraftWrap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ccb2"/>
      <stop offset="60%" stop-color="#b08968"/>
      <stop offset="100%" stop-color="#7f4f24"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <filter id="bloomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Magical Aura / Sparks -->
  <g opacity="0.85">
    <circle cx="250" cy="220" r="180" fill="radial-gradient(circle, rgba(255,230,167,0.4) 0%, rgba(212,163,115,0) 70%)"/>
    <!-- Floating Sparkles -->
    <path d="M 120 160 L 126 148 L 132 160 L 126 172 Z" fill="#ffe6a7"/>
    <path d="M 370 140 L 378 126 L 386 140 L 378 154 Z" fill="#ffe6a7"/>
    <path d="M 240 70 L 246 58 L 252 70 L 246 82 Z" fill="#ffffff"/>
    <path d="M 100 250 L 105 240 L 110 250 L 105 260 Z" fill="#ffe6a7"/>
    <path d="M 390 260 L 395 250 L 400 260 L 395 270 Z" fill="#ffe6a7"/>
  </g>

  <!-- Kraft Paper Wrapping Background -->
  <g id="wrapping_back">
    <path d="M 160 220 L 250 460 L 340 220 L 390 170 L 250 190 L 110 170 Z" fill="#7f4f24" stroke="#4a2810" stroke-width="4"/>
  </g>

  <!-- Eucalyptus & Baby's Breath Leaves -->
  <g id="foliage">
    <!-- Green Leaves -->
    <path d="M 150 160 C 130 140, 120 100, 160 110 C 190 120, 170 160, 150 160 Z" fill="#588157" opacity="0.9"/>
    <path d="M 350 160 C 370 140, 380 100, 340 110 C 310 120, 330 160, 350 160 Z" fill="#588157" opacity="0.9"/>
    <path d="M 210 120 C 200 90, 220 70, 240 90 C 250 110, 230 130, 210 120 Z" fill="#3a5a40" opacity="0.9"/>
    <path d="M 290 120 C 300 90, 280 70, 260 90 C 250 110, 270 130, 290 120 Z" fill="#3a5a40" opacity="0.9"/>
    <!-- Small baby breath flowers -->
    <circle cx="140" cy="120" r="4" fill="#ffffff"/>
    <circle cx="150" cy="105" r="3.5" fill="#ffffff"/>
    <circle cx="360" cy="120" r="4" fill="#ffffff"/>
    <circle cx="350" cy="105" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Brown & Cream Blooming Roses -->
  <g id="roses_blooming" filter="url(#bloomGlow)">
    <!-- Rose 1 (Top Left - Warm Coffee Rose) -->
    <g transform="translate(180, 160)">
      <circle cx="0" cy="0" r="38" fill="url(#roseCoffee)"/>
      <path d="M -25 -10 C -30 -30, 0 -38, 20 -25 C 38 -10, 25 25, 0 32 C -25 25, -35 5, -25 -10 Z" fill="none" stroke="#faedcd" stroke-width="3" opacity="0.8"/>
      <path d="M -15 -5 C -20 -18, 5 -22, 12 -12 C 20 -2, 12 15, 0 18 C -15 15, -20 2, -15 -5 Z" fill="#4a2810"/>
      <circle cx="0" cy="0" r="7" fill="#faedcd"/>
    </g>

    <!-- Rose 2 (Top Right - Champagne Cream Rose) -->
    <g transform="translate(320, 160)">
      <circle cx="0" cy="0" r="38" fill="url(#roseCream)"/>
      <path d="M -25 -10 C -30 -30, 0 -38, 20 -25 C 38 -10, 25 25, 0 32 C -25 25, -35 5, -25 -10 Z" fill="none" stroke="#b08968" stroke-width="3" opacity="0.8"/>
      <path d="M -15 -5 C -20 -18, 5 -22, 12 -12 C 20 -2, 12 15, 0 18 C -15 15, -20 2, -15 -5 Z" fill="#a06c4b"/>
      <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    </g>

    <!-- Rose 3 (Center - Grand Brown Velvet Rose) -->
    <g transform="translate(250, 210) scale(1.25)">
      <circle cx="0" cy="0" r="42" fill="url(#roseBrown1)"/>
      <path d="M -30 -15 C -35 -35, 5 -45, 25 -30 C 45 -12, 32 30, 0 38 C -30 30, -42 8, -30 -15 Z" fill="none" stroke="#fff" stroke-width="3.5" opacity="0.85"/>
      <path d="M -20 -8 C -24 -22, 8 -28, 18 -15 C 26 -2, 18 20, 0 24 C -18 20, -25 4, -20 -8 Z" fill="#6f4e37"/>
      <circle cx="0" cy="0" r="9" fill="#faedcd"/>
    </g>

    <!-- Rose 4 (Bottom Left - Soft Cream) -->
    <g transform="translate(195, 260) scale(0.95)">
      <circle cx="0" cy="0" r="35" fill="url(#roseCream)"/>
      <path d="M -20 -8 C -25 -25, 0 -32, 18 -20 C 32 -8, 20 20, 0 25 C -20 20, -28 5, -20 -8 Z" fill="none" stroke="#b08968" stroke-width="3" opacity="0.8"/>
      <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    </g>

    <!-- Rose 5 (Bottom Right - Warm Toffee Rose) -->
    <g transform="translate(305, 260) scale(0.95)">
      <circle cx="0" cy="0" r="35" fill="url(#roseCoffee)"/>
      <path d="M -20 -8 C -25 -25, 0 -32, 18 -20 C 32 -8, 20 20, 0 25 C -20 20, -28 5, -20 -8 Z" fill="none" stroke="#faedcd" stroke-width="3" opacity="0.8"/>
      <circle cx="0" cy="0" r="6" fill="#faedcd"/>
    </g>
  </g>

  <!-- Kraft Paper Wrapping Front Fold -->
  <g id="wrapping_front">
    <path d="M 140 280 L 250 480 L 210 290 Z" fill="url(#kraftWrap)" stroke="#4a2810" stroke-width="3"/>
    <path d="M 360 280 L 250 480 L 290 290 Z" fill="url(#kraftWrap)" stroke="#4a2810" stroke-width="3"/>
    <path d="M 180 300 Q 250 330 320 300 L 250 480 Z" fill="#ddb892" stroke="#7f4f24" stroke-width="3"/>
  </g>

  <!-- Golden Silk Bow Ribbon -->
  <g id="ribbon" transform="translate(250, 360)">
    <!-- Ribbon Loop Left -->
    <path d="M 0 0 C -45 -30, -50 25, 0 6 Z" fill="url(#goldRibbon)" stroke="#744210" stroke-width="3"/>
    <!-- Ribbon Loop Right -->
    <path d="M 0 0 C 45 -30, 50 25, 0 6 Z" fill="url(#goldRibbon)" stroke="#744210" stroke-width="3"/>
    <!-- Tails -->
    <path d="M -6 4 L -25 55 L -10 50 L 0 55 L -2 10 Z" fill="url(#goldRibbon)" stroke="#744210" stroke-width="2.5"/>
    <path d="M 6 4 L 25 55 L 10 50 L 0 55 L 2 10 Z" fill="url(#goldRibbon)" stroke="#744210" stroke-width="2.5"/>
    <!-- Center knot -->
    <circle cx="0" cy="3" r="10" fill="#ffe6a7" stroke="#744210" stroke-width="2.5"/>
  </g>

  <!-- "Click Me" Glowing Indicator Ring -->
  <g id="pulse_ring" opacity="0.8">
    <circle cx="250" cy="220" r="140" fill="none" stroke="#ffe6a7" stroke-width="3" stroke-dasharray="10,6"/>
  </g>
</svg>
