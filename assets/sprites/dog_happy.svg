<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="cushionGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="50%" stop-color="#c9184a"/>
      <stop offset="100%" stop-color="#800f2f"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a7"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="50%" stop-color="#faedcd"/>
      <stop offset="100%" stop-color="#e9d8a6"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="460" rx="190" ry="25" fill="rgba(0,0,0,0.3)"/>

  <!-- Velvet Cushion -->
  <g id="cushion" filter="url(#shadow2)">
    <path d="M 70 410 C 70 370, 160 360, 250 360 C 340 360, 430 370, 430 410 C 430 450, 340 455, 250 455 C 160 455, 70 450, 70 410 Z" fill="url(#cushionGrad2)" stroke="#590d22" stroke-width="4"/>
    <path d="M 80 425 Q 165 440 250 440 Q 335 440 420 425" fill="none" stroke="url(#goldGrad2)" stroke-width="6" stroke-dasharray="8,4"/>
    <g fill="url(#goldGrad2)">
      <circle cx="85" cy="425" r="7"/>
      <path d="M 85 432 L 75 455 L 95 455 Z"/>
      <circle cx="415" cy="425" r="7"/>
      <path d="M 415 432 L 405 455 L 425 455 Z"/>
    </g>
  </g>

  <!-- Key left on the cushion -->
  <g id="released_key" transform="translate(130, 410) rotate(-45)" filter="url(#shadow2)">
    <circle cx="0" cy="0" r="14" fill="url(#goldGrad2)" stroke="#5c3d11" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#800f2f"/>
    <rect x="-3" y="12" width="6" height="42" fill="url(#goldGrad2)" stroke="#5c3d11" stroke-width="2.5"/>
    <path d="M 3 40 L 14 40 L 14 46 L 8 46 L 8 50 L 14 50 L 14 54 L 3 54 Z" fill="url(#goldGrad2)" stroke="#5c3d11" stroke-width="2"/>
  </g>

  <!-- Happy Puppy -->
  <g id="happy_puppy" filter="url(#shadow2)">
    <!-- Tail wagging fast with motion lines -->
    <path d="M 160 340 Q 120 310 135 270 Q 155 285 170 320" fill="#211f24" stroke="#141217" stroke-width="4"/>
    <!-- Tail motion swooshes -->
    <path d="M 115 280 Q 105 295 110 310" stroke="#ffd166" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 100 290 Q 92 305 98 320" stroke="#ffd166" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Body -->
    <ellipse cx="250" cy="310" rx="85" ry="90" fill="#2b2830" stroke="#141217" stroke-width="5"/>
    <!-- Chest fluff -->
    <path d="M 230 270 Q 250 310 235 340 Q 250 325 265 340 Q 255 310 270 270 Z" fill="#fdf0d5" opacity="0.9"/>

    <!-- Hind Paws -->
    <ellipse cx="180" cy="385" rx="32" ry="24" fill="#211f24" stroke="#141217" stroke-width="4"/>
    <ellipse cx="320" cy="385" rx="32" ry="24" fill="#211f24" stroke="#141217" stroke-width="4"/>

    <!-- Head tilted slightly in joy -->
    <g transform="rotate(3 250 195)">
      <circle cx="250" cy="195" r="85" fill="#2b2830" stroke="#141217" stroke-width="5"/>

      <!-- Floppy Ears happily bouncing -->
      <path d="M 185 140 C 120 135, 110 220, 140 260 C 165 265, 190 220, 190 165 Z" fill="#1b1820" stroke="#141217" stroke-width="5"/>
      <path d="M 155 170 C 140 195, 140 235, 155 248" stroke="#ffb4a2" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

      <path d="M 315 140 C 380 135, 390 220, 360 260 C 335 265, 310 220, 310 165 Z" fill="#1b1820" stroke="#141217" stroke-width="5"/>
      <path d="M 345 170 C 360 195, 360 235, 345 248" stroke="#ffb4a2" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

      <!-- Joyful Happy Closed Eyes (^ _ ^) -->
      <path d="M 195 185 Q 210 170 225 185" stroke="#141217" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M 190 175 Q 185 168 182 172" stroke="#141217" stroke-width="3" fill="none" stroke-linecap="round"/>

      <path d="M 275 185 Q 290 170 305 185" stroke="#141217" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M 310 175 Q 315 168 318 172" stroke="#141217" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Rosy Cheeks -->
      <ellipse cx="180" cy="210" rx="15" ry="9" fill="#ff758c" opacity="0.8"/>
      <ellipse cx="320" cy="210" rx="15" ry="9" fill="#ff758c" opacity="0.8"/>

      <!-- Cute Snout & Happy Open Mouth Chewing -->
      <ellipse cx="250" cy="225" rx="30" ry="20" fill="#fdf0d5"/>
      <path d="M 242 215 C 242 210, 258 210, 258 215 C 258 223, 242 223, 242 215 Z" fill="#3a2e2d"/>
      <!-- Happy Tongue & Smile -->
      <path d="M 240 228 Q 250 248 260 228 Z" fill="#ff758c"/>

      <!-- Pink Collar with Gold Bell -->
      <path d="M 200 262 Q 250 278 300 262" stroke="#ff758c" stroke-width="12" stroke-linecap="round" fill="none"/>
      <circle cx="250" cy="274" r="9" fill="url(#goldGrad2)" stroke="#744210" stroke-width="2"/>

      <!-- Head Bow Ribbon -->
      <g transform="translate(190, 115) rotate(-15)">
        <path d="M 0 0 C -25 -20, -30 15, 0 5 Z" fill="#ff758c" stroke="#c9184a" stroke-width="2"/>
        <path d="M 0 0 C 25 -20, 30 15, 0 5 Z" fill="#ff758c" stroke="#c9184a" stroke-width="2"/>
        <circle cx="0" cy="2" r="6" fill="#ffd166"/>
      </g>
    </g>

    <!-- Delicious Chew Bone held between front paws -->
    <g id="chew_bone" transform="translate(250, 340) rotate(-10)" filter="url(#shadow2)">
      <!-- Bone Ends Left -->
      <circle cx="-42" cy="-8" r="10" fill="url(#boneGrad)" stroke="#b08968" stroke-width="2.5"/>
      <circle cx="-42" cy="8" r="10" fill="url(#boneGrad)" stroke="#b08968" stroke-width="2.5"/>
      <!-- Bone Shaft -->
      <rect x="-35" y="-7" width="70" height="14" rx="4" fill="url(#boneGrad)" stroke="#b08968" stroke-width="2.5"/>
      <!-- Bone Ends Right -->
      <circle cx="42" cy="-8" r="10" fill="url(#boneGrad)" stroke="#b08968" stroke-width="2.5"/>
      <circle cx="42" cy="8" r="10" fill="url(#boneGrad)" stroke="#b08968" stroke-width="2.5"/>
      <!-- Tiny Pink Ribbon Bow on bone -->
      <circle cx="0" cy="0" r="4" fill="#ff758c"/>
    </g>

    <!-- Front Paws holding bone tightly -->
    <ellipse cx="215" cy="345" rx="22" ry="18" fill="#2b2830" stroke="#141217" stroke-width="3.5"/>
    <ellipse cx="285" cy="345" rx="22" ry="18" fill="#2b2830" stroke="#141217" stroke-width="3.5"/>

    <!-- Floating Love Hearts -->
    <g fill="#ff758c" opacity="0.85">
      <path d="M 140 140 C 140 130, 125 125, 125 135 C 125 145, 140 155, 140 155 C 140 155, 155 145, 155 135 C 155 125, 140 130, 140 140 Z" transform="scale(1.2) translate(-30, -20)"/>
      <path d="M 330 130 C 330 122, 318 118, 318 126 C 318 134, 330 142, 330 142 C 330 142, 342 134, 342 126 C 342 118, 330 122, 330 130 Z"/>
    </g>
  </g>
</svg>
